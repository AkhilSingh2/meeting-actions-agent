<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" role="img" aria-labelledby="title desc">
  <title id="title">Quorum pipeline</title>
  <desc id="desc">A transcript is parsed into cues, then either the heuristic engine or an optional model extracts structured outcomes. Citations are attached, a person reviews them, and the result can be saved locally or exported.</desc>
  <style>
    text { font-family: Georgia, "Iowan Old Style", serif; fill: #1c1916; }
    .small { font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 12px; fill: #4e4942; }
    .label { font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 14px; }
  </style>
  <rect width="980" height="220" rx="16" fill="#fbf8f2"/>
  <g>
    <rect x="24" y="58" width="140" height="72" rx="10" fill="#f3efe6" stroke="#ddd4c6"/>
    <text class="label" x="94" y="90" text-anchor="middle">Transcript</text>
    <text class="small" x="94" y="110" text-anchor="middle">paste, VTT, SRT, docx</text>
    <rect x="196" y="58" width="140" height="72" rx="10" fill="#f3efe6" stroke="#ddd4c6"/>
    <text class="label" x="266" y="90" text-anchor="middle">Cues</text>
    <text class="small" x="266" y="110" text-anchor="middle">speaker, time, line</text>
    <rect x="368" y="28" width="160" height="64" rx="10" fill="#f3e4da" stroke="#7c3418"/>
    <text class="label" x="448" y="54" text-anchor="middle">Heuristic</text>
    <text class="small" x="448" y="74" text-anchor="middle">default, no key</text>
    <rect x="368" y="108" width="160" height="64" rx="10" fill="#f3efe6" stroke="#ddd4c6"/>
    <text class="label" x="448" y="134" text-anchor="middle">Live model</text>
    <text class="small" x="448" y="154" text-anchor="middle">optional structured output</text>
    <rect x="560" y="58" width="150" height="72" rx="10" fill="#f3efe6" stroke="#ddd4c6"/>
    <text class="label" x="635" y="90" text-anchor="middle">Review board</text>
    <text class="small" x="635" y="110" text-anchor="middle">edit, cite, status</text>
    <rect x="742" y="58" width="210" height="72" rx="10" fill="#1c1916"/>
    <text class="label" x="847" y="90" text-anchor="middle" fill="#f7f3eb">Export</text>
    <text class="small" x="847" y="110" text-anchor="middle" fill="#c8c0b4">md, csv, ics, tickets</text>
  </g>
  <g stroke="#7c3418" stroke-width="1.5" fill="none">
    <path d="M164 94 H196"/>
    <path d="M336 94 H368"/>
    <path d="M528 60 H544 V94 H560"/>
    <path d="M528 140 H544 V94 H560"/>
    <path d="M710 94 H742"/>
  </g>
</svg>
